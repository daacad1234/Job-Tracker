# ==============================
# Server
# ==============================
server.port=8081

# ==============================
# Database (PostgreSQL)
# ==============================
spring.datasource.url=jdbc:postgresql://localhost:5432/jobboard_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==============================
# JWT
# ==============================
# IMPORTANT (security): in production, override this via an environment
# variable (JWT_SECRET) instead of committing a real secret to source control.
# Generate one with: openssl rand -base64 64
jwt.secret=${JWT_SECRET:CHANGE_ME_dev_only_super_secret_key_please_replace_before_deploying_1234567890}
jwt.expiration-ms=86400000

# ==============================
# CORS (React dev server)
# ==============================
app.cors.allowed-origins=http://localhost:5173, http://localhost:5174

# ==============================
# Logging
# ==============================
logging.level.org.springframework.security=INFO
logging.level.com.jobboard=DEBUG
